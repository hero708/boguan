name: Native crypto

on:
  push:
    # 只在 master 上跑：以前 push 没有分支过滤，仓库里任何分支每次推送都会
    # 跑一遍 ASan，而同一次提交的 PR 还会再跑一遍。
    branches: [master]
    paths: &native_paths
      - 'native/**'
      - 'test/native_*'
      - 'scripts/verify_audio_cenc.cjs'
      - 'test/verify_audio_cenc_test.cjs'
      - 'test/support/cenc_fixture.cjs'
      - 'test/support/native_compile.cjs'
      - '.github/workflows/native-crypto.yml'
  pull_request:
    paths: *native_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install compiler and media fixtures tool
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ffmpeg
      - name: C core, malformed input, and real media with sanitizers
        env:
          NATIVE_CC: clang
          NATIVE_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          node --test --test-concurrency=1
          test/native_aes_test.cjs
          test/native_crypto_test.cjs
          test/native_crypto_media_test.cjs
      # Host-side atempo/resample regressions (issue #129). The test compiles
      # its own drivers from native/tests with -Werror, so it needs the clang
      # installed above.
      - name: Time-stretch, resample, and flush host regressions
        env:
          NATIVE_CC: clang
        run: node --test test/native_atempo_test.cjs
      - name: Check bounded downloads and complete audio diagnostics
        run: node --test test/verify_audio_cenc_test.cjs
